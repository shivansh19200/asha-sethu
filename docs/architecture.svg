<text x="800" y="70" text-anchor="middle" font-size="54" font-weight="700" font-family="Georgia,serif" fill="#F4F7F9" >Asha Sethu: System Architecture</text>
<text x="800" y="112" text-anchor="middle" font-size="24" font-weight="400" fill="#9FB0BC" >Voice-first triage for ASHA home visits, with a plain-code safety floor</text>
